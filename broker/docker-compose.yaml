services:
  broker:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./passwd:/mosquitto/config/passwd:ro
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
